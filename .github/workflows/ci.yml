name: CI Quality Gate & Validation Lab

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Typecheck, Unit Tests & Production Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22, 24]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: TypeScript Lint & Contract Verification
        run: npm run lint

      - name: Run Test Suite (JBI Inventory, APA 7, DOI, Norsk Lov)
        run: npm test

      - name: Production Bundle Compilation
        run: npm run build
